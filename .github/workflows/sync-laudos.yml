name: Sincronizar modelos de laudos
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/sync_catalog.py
      - .github/workflows/sync-laudos.yml
permissions:
  contents: write
concurrency:
  group: laudos-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Copiar catalogo e modelos sem executar conteudo
        run: python3 scripts/sync_catalog.py
      - name: Salvar alteracoes no repositorio
        run: |
          git config user.name 'Uniware Catalog Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if [ -d modelos ]; then git add modelos; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar catalogo de laudos'
            git push
          fi
